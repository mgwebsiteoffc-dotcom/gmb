function load(){
  try{const raw=localStorage.getItem(LS_DB); if(raw){const p=JSON.parse(raw); return Object.assign({},SEED,p);} }catch(e){}

}

function stars(r){let s='';for(let i=1;i<=5;i++){s+=i<=r?'★':'☆';}return s;}

}

/* AI reply generator (template-based, replicating untab's tone logic) */
function aiReply(review,tone){
  const author=(review.author||'').split(' ')[0]||'there';
  const loc=locName(review.location_id);
  const r=review.rating||5;
  const kws=review.keywords||[];
  let out='';
  if(r>=4){
    if(tone==='professional') out=`Thank you for taking the time to share your feedback, ${author}. We appreciate your trust in ${loc} and remain dedicated to delivering exceptional service. We look forward to your next visit.`;
    else if(tone==='seo') out=`Thank you ${author}! We take great pride in providing the best ${kws.length?kws.slice(0,2).join(' and '):'high quality local service'} in the area. Your support for ${loc} means everything to our local team!`;
    else if(tone==='casual') out=`Thanks a bunch, ${author}! So glad you enjoyed your visit with us at ${loc}. Can't wait to welcome you back!`;
    else out=`Hi ${author}! Thank you so much for the glowing ${r}-star review! The entire team at ${loc} is delighted to know you had such a great experience. See you again soon! ✨`;
  } else if(r===3){
    if(tone==='empathetic'||tone==='apologetic') out=`Hi ${author}, thank you for your honest feedback. We apologise that some aspects did not meet our usual high standards. We would love to make things right — please reach out to our management team.`;
    else out=`Dear ${author}, thank you for bringing this to our attention. We strive for excellence and take your feedback seriously. Our team is reviewing this.`;
  } else {
    if(tone==='empathetic'||tone==='apologetic') out=`Dear ${author}, we sincerely apologise that your recent visit did not meet your expectations. Providing exceptional service is our top priority. Please contact our general manager so we can make this right.`;
    else out=`Hello ${author}, we take all customer feedback very seriously. We apologise for the frustration caused. Please contact us at your earliest convenience so we can address your concerns.`;
  }
  return out;
}
function aiCaption(type,biz){

  if(type==='EVENT') return {title:`Upcoming Community Workshop & Q&A at ${biz}`,content:`📅 Mark your calendars! Join our specialists for an exclusive interactive session with tips, demonstrations, and special giveaways. Free admission!`,coupon:'',cta:'SIGN_UP'};
  return {title:`Exciting New Updates at ${biz}`,content:`✨ We are continually upgrading our facilities, services, and team training to provide you with the smoothest local experience. Stop by today or book online!`,coupon:'',cta:'LEARN_MORE'};
}

/* ---------------- The Brain (OpenRouter) --------------
   When the user pastes an OpenRouter API key in Settings, the AI Review Reply
   Assistant and the Google Posts caption engine call a real LLM. Without a key
   they fall back to the offline templates above so the demo always works.     */
const BRAIN={
  get key(){ return (DB.settings&&DB.settings.ai_key)?String(DB.settings.ai_key).trim():''; },
  get model(){ return (DB.settings&&DB.settings.ai_model)?DB.settings.ai_model:'nvidia/nemotron-3.5-lightning:free'; },
  get on(){ return !!this.key; },
  async chat(messages){
    if(!this.on) return null;
    try{
      const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+this.key,'Content-Type':'application/json'},
        body:JSON.stringify({model:this.model,messages,reasoning:{enabled:false},temperature:0.6,max_tokens:700})
      });
      if(!res.ok) return null;
      const d=await res.json();
      const c=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      return (c&&String(c).trim())?String(c).trim():null;
    }catch(e){ return null; }
  },
  async reply(review,tone){
    const author=(review.author||'').split(' ')[0]||'there';
    const loc=locName(review.location_id);
    const r=review.rating||5;
    const kws=(review.keywords||[]).slice(0,4).join(', ');
    const sys=`You are Untab, representing ${loc}. You reply to Google Business Profile reviews on behalf of the business owner. Match the review's sentiment. Tone: ${tone}. Keep it 2-4 sentences, under 220 characters, no hashtags, on brand. Reply directly to the customer only. No preface.`;
    let user=`Author: ${author}\nStar rating: ${r}/5\nReview: "${review.snippet||''}"`;
    if(kws) user+=`\nLocal keywords to weave in naturally if relevant: ${kws}`;
    if(r>=4) user+=`\nThis is a positive review — thank them sincerely and invite them to return.`;
    else if(r===3) user+=`\nThis is a mixed review — acknowledge feedback politely, apologize for any shortfall, offer to make it right.`;
    else user+=`\nThis is a negative review — apologize genuinely, take responsibility, offer to resolve offline, no defensive tone.`;
    return this.chat([{role:'system',content:sys},{role:'user',content:user}]);
  },
  async caption(type,biz){
    if(!this.on) return null;
    const kind=type==='OFFER'?'a limited-time promotional offer':type==='EVENT'?'an upcoming community event':'a "what\'s new" update';
    const sys=`You are Untab, an expert local-marketing copywriter. Write a short, high-converting, SEO-friendly Google Business Profile post. Respond with strict JSON using ONLY these keys: title, content, coupon_code, terms, cta_type. cta_type must be one of BOOK, ORDER, BUY, LEARN_MORE, SIGN_UP, CALL_NOW. No markdown, no extra text.`;
    const user=`Create ${kind} for the business "${biz}". Include a clear call-to-action and make the copy persuasive. Return only the JSON object.`;
    const raw=await this.chat([{role:'system',content:sys},{role:'user',content:user}]);
    if(!raw) return null;
    try{ const d=JSON.parse(raw); if(d&&d.title&&d.content) return d; }catch(e){}
    return null;
  }
};

let activeLoc='all'; // 'all' | 'client-c1' | 'l1'
function scopeQuery(locs){
  if(activeLoc==='all') return locs;
  if(activeLoc.startsWith('client-')){ const cid=activeLoc.replace('client-',''); return locs.filter(l=>l.client_id===cid); }
  return locs.filter(l=>l.id===activeLoc);
}

let reviewFilter={rating:'all',sentiment:'all',status:'all',search:''};
function viewReviews(){
  const locs=scopeQuery(DB.locations);

  const list=DB.reviews.filter(r=>{
    if(!ids.has(r.location_id)) return false;
    if(reviewFilter.rating!=='all' && r.rating!==Number(reviewFilter.rating)) return false;
    if(reviewFilter.sentiment!=='all' && r.sentiment!==reviewFilter.sentiment) return false;
    if(reviewFilter.status!=='all' && r.status!==reviewFilter.status) return false;
    if(reviewFilter.search && !((r.author+r.snippet).toLowerCase().includes(reviewFilter.search.toLowerCase()))) return false;
    return true;
  });
  const unanswered=DB.reviews.filter(r=>r.status==='unanswered').length;
  return `<div class="space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div><span class="text-xs font-bold text-brand-600 bg-brand-50 px-2.5 py-0.5 rounded-full uppercase">Unified Review Inbox</span>

      <button id="bulkAi" class="bg-brand-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md">✨ Bulk AI Reply All Unanswered (${unanswered})</button>

        <select id="reviewRating" class="px-3 py-2 rounded-xl border border-slate-200 text-xs"><option value="all">All ratings</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${reviewFilter.rating==String(n)?'selected':''}>${'★'.repeat(n)}${'☆'.repeat(5-n)} (${n})</option>`).join('')}</select>

        <select id="reviewStatus" class="px-3 py-2 rounded-xl border border-slate-200 text-xs"><option value="all">All status</option><option value="unanswered" ${reviewFilter.status==='unanswered'?'selected':''}>Needs Reply</option><option value="replied" ${reviewFilter.status==='replied'?'selected':''}>Replied</option></select>
      </div>
    </div>
    <div class="space-y-3">${list.map(r=>`<div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4">
      <div class="flex items-start gap-3 md:w-64 flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-brand-100 flex items-center justify-center font-black text-brand-700 flex-shrink-0">${esc(r.author[0])}</div>
        <div><div class="font-bold text-slate-800 text-sm">${esc(r.author)}</div><div class="text-amber-400 text-sm">${stars(r.rating)}</div><div class="text-[10px] text-slate-400">${esc(r.date)} · ${esc(locName(r.location_id).split(' - ')[0])}</div></div>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm text-slate-600">${esc(r.snippet)}</p>
        ${(r.keywords||[]).length?`<div class="flex flex-wrap gap-1 mt-2">${r.keywords.map(k=>`<span class="text-[10px] bg-brand-50 text-brand-700 px-2 py-0.5 rounded-full font-bold">${esc(k)}</span>`).join('')}</div>`:''}
        <div class="flex items-center gap-2 mt-3 flex-wrap">
          <span class="text-[10px] font-bold ${r.sentiment==='positive'?'text-emerald-600':r.sentiment==='negative'?'text-red-600':'text-amber-600'}">${r.sentiment==='positive'?'▲ Positive':r.sentiment==='negative'?'▼ Negative':'▪ Neutral'}</span>

        </div>
      </div>
      <div class="flex flex-col md:items-end justify-center gap-2 flex-shrink-0">
        ${r.status==='unanswered'?`<button class="aiReplyBtn text-xs font-bold text-white bg-brand-600 px-4 py-2 rounded-xl" data-id="${r.id}">✨ AI Reply</button>`:`<div class="text-[11px] text-slate-500 italic max-w-xs text-right">"${esc(r.reply)}"</div>`}

function openAiModal(id){
  const r=DB.reviews.find(x=>x.id===id); if(!r)return;
  const modal=document.createElement('div');
  modal.id="aiModal";
  modal.className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
  modal.innerHTML=`<div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-r from-brand-700 to-indigo-800 p-5 text-white flex items-center justify-between"><div><h3 class="font-bold">AI Review Reply Assistant</h3><p class="text-[11px] text-brand-200">Replying to ${esc(r.author)} (${r.rating}★)</p></div><button class="aiClose text-white text-xl font-bold">✕</button></div>
    <div class="p-6 space-y-4">
      <div><label class="text-xs font-bold text-slate-700 uppercase">Tone</label><select id="aiTone" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 text-xs">
        <option value="friendly">Warm & Friendly</option><option value="professional">Professional</option><option value="seo">SEO Keyword Rich</option><option value="empathetic">Empathetic / Apology</option><option value="casual">Casual</option></select></div>
      <div><label class="text-xs font-bold text-slate-700 uppercase">Message</label><textarea id="aiText" rows="4" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 text-xs">${esc(r.reply||aiReply(r,'friendly'))}</textarea></div>
      <div class="flex justify-end gap-2"><button class="aiRegen text-xs font-bold text-brand-600 bg-brand-50 px-4 py-2 rounded-xl">↻ Regenerate</button><button class="aiSave text-xs font-bold text-white bg-brand-600 px-4 py-2 rounded-xl">Publish Reply</button></div>
    </div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('.aiClose').onclick=()=>modal.remove();
  const tl=modal.querySelector('#aiText');
  async function regen(){
    const t=modal.querySelector('#aiTone').value;
    const live=BRAIN.on?await BRAIN.reply(r,t):null;
    tl.value=(live&&live.trim())?live.trim():aiReply(r,t);
  }
  modal.querySelector('.aiRegen').onclick=regen;
  modal.querySelector('.aiSave').onclick=()=>{
    const txt=tl.value.trim();
    r.reply=txt; r.status='replied';
    const l=locOf(r.location_id); if(l) l.unanswered=Math.max(0,l.unanswered-1);
    save(); toast('Reply published to Google Business Profile.'); modal.remove(); render();
  };
  if(BRAIN.on){ const btn=modal.querySelector('.aiRegen'); btn.textContent='↻ Regenerate (AI)'; }
}

function locationScore(l){
  // Composite 0-100 performance score: health (50%), rating (20%), engagement volume (30%).
  const reviews=Number(l.review_count||0), views=Number(l.views||0), calls=Number(l.calls||0), dirs=Number(l.directions||0), clicks=Number(l.clicks||0), unans=Number(l.unanswered||0);
  const health=Number(l.health||0);
  const rating=Number(l.rating||0)*20;                        // out of 100
  const engagement=Math.min(100,((views/1000)+(calls*2)+(dirs+clicks)*0.5)/8);
  const replyHealth=Math.max(0,100-unans*20);
  return Math.round(health*0.4+rating*0.25+Math.min(100,engagement)*0.2+replyHealth*0.15);
}

/* ---------------- Render ---------------- */
function render(){
  const route=currentRoute();
  const app=document.getElementById('app');
  if(!session){
    app.innerHTML=authScreen(location.hash.includes('register')?'register':'login');
    bindAuth();
    return;
  }
  let content='';
  switch(route){
    case 'reviews': content=viewReviews(); break;
    case 'posts': content=viewPosts(); break;
    case 'insights': content=viewInsights(); break;
    case 'search-console': content=viewSearchConsole(); break;
    case 'media': content=viewMedia(); break;
    case 'reports': content=viewReports(); break;
    case 'team': content=viewTeam(); break;
    case 'connect': content=viewConnect(); break;
    case 'settings': content=viewSettings(); break;
    default: content=viewDashboard();
  }
  app.innerHTML=shell(content,route);
  bindShell();
  if(route==='insights') drawInsightCharts();
  if(route==='search-console') drawDeviceChart();
  liveUpdateHandlers();
}

/* ---- shell bindings ---- */
function bindShell(){
  const scope=document.getElementById('scopeSelect');
  if(scope) scope.onchange=(e)=>{activeLoc=e.target.value; save(); render();};
  const lg=document.getElementById('logoutBtn'); if(lg) lg.onclick=doLogout;
  const qr=document.getElementById('quickReport'); if(qr) qr.onclick=()=>location.hash='#/reports';
}
function liveUpdateHandlers(){
  // Reviews filters
  const rs=document.getElementById('reviewSearch'); if(rs) rs.oninput=()=>{reviewFilter.search=rs.value; renderListOnlyReviews();};
  ['reviewRating','reviewSentiment','reviewStatus'].forEach(id=>{const el=document.getElementById(id); if(el) el.onchange=()=>{reviewFilter[id.replace('review','').toLowerCase()]=el.value; renderListOnlyReviews();};});
  const bulk=document.getElementById('bulkAi'); if(bulk) bulk.onclick=async ()=>{
    const pending=DB.reviews.filter(r=>r.status==='unanswered');
    if(!pending.length){ toast('No unanswered reviews.'); return; }
    toast(`Generating replies for ${pending.length} reviews…`);
    let n=0;
    for(const r of pending){
      r.reply=(BRAIN.on?await BRAIN.reply(r,'friendly'):null)||aiReply(r,'friendly');
      r.status='replied'; n++;
      const l=locOf(r.location_id); if(l) l.unanswered=Math.max(0,l.unanswered-1);
    }
    save(); render(); toast(`Published AI replies for ${n} reviews (${BRAIN.on?'OpenRouter':''})!`);
  };
  // review AI buttons
  $$('.aiReplyBtn').forEach(b=>b.onclick=()=>openAiModal(b.dataset.id));
  // posts
  const pt=document.getElementById('postType'); if(pt) pt.onchange=()=>{postState.type=pt.value; render();};
  const at=document.getElementById('postTitle'); if(at) at.oninput=()=>{pval('pvTitle',at.value);};
  const ac=document.getElementById('postContent'); if(ac) ac.oninput=()=>{pval('pvContent',ac.value);};
  const ap=document.getElementById('postCoupon'); if(ap) ap.oninput=()=>{pval('pvCoupon',ap.value||'—');};
  const ai=document.getElementById('aiCaption'); if(ai) ai.onclick=async ()=>{
    const biz=document.getElementById('postBiz').value||'Our Business';
    const live=BRAIN.on?await BRAIN.caption(postState.type,biz):null;
    const cap=live&&live.title?live:aiCaption(postState.type,biz);
    document.getElementById('postTitle').value=cap.title; document.getElementById('postContent').value=cap.content;
    if(cap.coupon||cap.coupon_code) document.getElementById('postCoupon').value=cap.coupon||cap.coupon_code;
    if(cap.cta||cap.cta_type) document.getElementById('postCta').value=cap.cta||cap.cta_type;
    pval('pvTitle',cap.title);pval('pvContent',cap.content);pval('pvCoupon',(cap.coupon||cap.coupon_code)||'—');
    toast(BRAIN.on?'AI caption generated (OpenRouter)!':'AI caption generated!');
  };
  const cp=document.getElementById('createPost'); if(cp) cp.onclick=createPost;
  $$('.postDel').forEach(b=>b.onclick=()=>{DB.posts=DB.posts.filter(p=>p.id!==b.dataset.id); save(); toast('Post deleted.'); render();});
  $$('.postPublish').forEach(b=>b.onclick=()=>{const p=DB.posts.find(x=>x.id===b.dataset.id); if(p){p.status='PUBLISHED';p.date=new Date().toLocaleString();save();toast('Post published.');render();}});
  // media
  $$('.mediaCat').forEach(b=>b.onclick=()=>{mediaCat=b.dataset.cat; render();});
  $$('.mediaDel').forEach(b=>b.onclick=()=>{DB.media=DB.media.filter(m=>m.id!==b.dataset.id); save(); toast('Media removed.'); render();});
  const ou=document.getElementById('openUpload'); if(ou) ou.onclick=openUploadModal;
  // reports
  const rcs=document.getElementById('reportClientSel'); if(rcs) rcs.onchange=()=>{reportClient=rcs.value; render();};
  const rn=document.getElementById('reportNotes'); if(rn) rn.oninput=()=>{const d=document.querySelector('#reportDoc p'); if(d)d.textContent=rn.value;};
  const ep=document.getElementById('exportPdf'); if(ep) ep.onclick=exportReportPdf;
  // team
  const ot=document.getElementById('openTeam'); if(ot) ot.onclick=openTeamModal;
  // connect
  const cb=document.getElementById('connectBtn'); if(cb) cb.onclick=()=>{
    const name=(document.getElementById('connName').value||'').trim(); if(!name){toast('Enter a business name.',false);return;}
    const cat=document.getElementById('connCat').value||'Local Business';
    const cid=uid('c'); DB.clients.push({id:cid,name,category:cat,logo:'🏢',color:'#6161ff'});
    DB.locations.push({id:uid('l'),client_id:cid,name:name+' - Primary Store',address:'700 Main St, Austin, TX',phone:'(512) 555-0100',category:cat,verified:true,rating:4.9,review_count:120,unanswered:0,health:96,views:12500,calls:180,directions:290,clicks:450,sync:'synced'});
    save(); toast('Business connected & synced!'); render();
  };
  // settings
  const ss=document.getElementById('saveSettings'); if(ss) ss.onclick=()=>{
    DB.settings.agency_name=document.getElementById('setAgency').value;
    DB.settings.domain=document.getElementById('setDomain').value;
    DB.settings.brand=document.getElementById('setBrand').value;
    DB.settings.support_email=document.getElementById('setEmail').value;
    DB.settings.email_alerts=document.getElementById('setEmailAlerts').checked;
    DB.settings.sms_alerts=document.getElementById('setSms').checked;
    const ak=document.getElementById('setAiKey'); if(ak) DB.settings.ai_key=ak.value.trim();
    save(); toast('Settings saved!'); render();
  };
}
function pval(id,v){const e=document.getElementById(id); if(e)e.textContent=v;}
function renderListOnlyReviews(){
  // Simply re-render fully to keep simple & reliable
  render();
}
function createPost(){
  const title=document.getElementById('postTitle').value.trim(); const content=document.getElementById('postContent').value.trim();
  if(!title||!content){toast('Post needs a title and content.',false);return;}
  const status=document.getElementById('postStatus').value;
  DB.posts.unshift({id:uid('p'),title,type:postState.type,target:document.getElementById('postTarget').value,content,coupon:document.getElementById('postCoupon').value,cta:document.getElementById('postCta').value,status,date:status==='SCHEDULED'?'2026-09-06 10:00 (scheduled)':new Date().toLocaleString(),views:status==='SCHEDULED'?0:120,clicks:status==='SCHEDULED'?0:12});
  save(); toast(status==='SCHEDULED'?'Post scheduled!':'Post published!'); render();
}

/* ---------------- Auth ---------------- */
function bindAuth(){
  const form=document.getElementById('authForm'); if(form) form.onsubmit=(e)=>{
    e.preventDefault();
    const email=document.getElementById('aEmail').value.trim(); const pass=document.getElementById('aPass').value;
    const mode=location.hash.includes('register')?'register':'login';
    const err=document.getElementById('authError'); const showErr=m=>{err.textContent=m; err.classList.remove('hidden');};
    if(mode==='register'){
      const name=document.getElementById('aName').value.trim(); const pass2=document.getElementById('aPass2').value;
      if(pass!==pass2){showErr('Passwords do not match.');return;}
      if((DB.users||[]).some(u=>u.email===email)){showErr('An account already exists with that email.');return;}
      DB.users.push({name,email,password:btoa(pass)}); save();
      session={name,email}; saveSession(); render(); return;
    }
    const u=(DB.users||[]).find(x=>x.email===email && x.password===btoa(pass));
    if(!u){showErr('Invalid credentials. Try the demo account below.');return;}
    session={name:u.name,email:u.email}; saveSession(); render();
  };
  const demo=document.getElementById('demoBtn'); if(demo) demo.onclick=()=>{session={name:'Demo User',email:'demo@untab.com'}; saveSession(); render();};
}
function doLogout(){session=null; saveSession(); location.hash='#/login'; render();}

/* ---------------- PDF export ---------------- */
function exportReportPdf(){
  if(!window.jspdf){toast('PDF library not ready.',false);return;}
  const c=DB.clients.find(x=>x.id===reportClient)||DB.clients[0];
  const locs=DB.locations.filter(l=>l.client_id===c.id);
  const views=locs.reduce((s,l)=>s+l.views,0),calls=locs.reduce((s,l)=>s+l.calls,0),dirs=locs.reduce((s,l)=>s+l.directions,0),clicks=locs.reduce((s,l)=>s+l.clicks,0),revs=locs.reduce((s,l)=>s+l.review_count,0);
  const notes=document.getElementById('reportNotes')?.value||'';
  const agency=document.getElementById('reportAgency')?.value||DB.settings.agency_name;
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.setFillColor(15,31,138); doc.rect(0,0,210,40,'F'); doc.setTextColor(255); doc.setFontSize(20); doc.text('Untab '+ (agency||''),14,20); doc.setFontSize(10); doc.text('Local SEO Performance Report',14,30);
  doc.setTextColor(30); doc.setFontSize(12); doc.text(c.name,14,50); doc.setFontSize(10); doc.text('Prepared for '+c.name,14,56);
  doc.text('Generated: '+new Date().toLocaleDateString(),14,62);
  let y=80; const kpis=[['Profile Views',views],['Calls',calls],['Directions',dirs],['Clicks',clicks],['Reviews',revs]];
  kpis.forEach(k=>{doc.setFontSize(10); doc.text(k[0]+':',14,y); doc.setFont('helvetica','bold'); doc.text(String(k[1]).replace(/\B(?=(\d{3})+(?!\d))/g,','),90,y); doc.setFont('helvetica','normal'); y+=8;});
  y+=8; doc.setFont('helvetica','bold'); doc.text('Executive Summary',14,y); doc.setFont('helvetica','normal');
  const lines=doc.splitTextToSize(notes||'No notes provided.',180); doc.setFontSize(11); y+=6; doc.text(lines,14,y);
  doc.save('untab-report-'+slug(c.name)+'.pdf');
  toast('PDF report exported!');
}

/* ---------------- Init ---------------- */
window.addEventListener('hashchange',render);
render();

})();
